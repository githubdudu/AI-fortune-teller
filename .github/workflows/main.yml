name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: docker.io/henrycyc/fortune-frontend
  BACKEND_IMAGE: docker.io/henrycyc/fortune-backend
  VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      # Frontend test
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Frontend - npm install and test
        run: |
          cd frontend
          npm install
          npm test

      # Backend test
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Create fake Firebase credentials for tests
        run: |
          mkdir -p ./backend/Api.Tests
          echo '{"type":"service_account","project_id":"test-project","private_key":"-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC7VJTUt9Us8cKj\nMzEfYyjiWA4R4/M2bS1GB4t7NXp98C3SC6dVMvDuictGeurT8jNbvJZHtCSuYEvu\nNMoSfm76oqFvAp8Gy0iz5sxjZmSnXyCdPEovGhLa0VzMaQ8s+CLOyS56YyCFGeJZ\n-----END PRIVATE KEY-----\n","client_email":"test@example.com"}' > ./backend/Api.Tests/firebase-credentials-test.json

      - name: Backend - Restore dependencies
        run: dotnet restore
        working-directory: ./backend

      - name: Backend - Build
        run: dotnet build --no-restore
        working-directory: ./backend

      - name: Backend - Test
        run: dotnet test --no-build --verbosity normal
        working-directory: ./backend
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=tarot_test_db;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
          ExternalServices__OpenAI__ApiKey: ${{ secrets.OPENAI_API_KEY }}
          Firebase__CredentialsPath: "./Api.Tests/firebase-credentials-test.json"

  build-and-deploy:
    name: Build and Deploy
    # This ensures the job only runs when a PR is merged into main
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment: CICD
    needs: [test] # Deployment happens after passing test successfully

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          cd frontend
          chmod +x build.sh
          ./build.sh ${{ env.VERSION }} --push

      - name: Build and push Backend image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          chmod +x build.sh
          ./build.sh ${{ env.VERSION }} --push

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DIGITALOCEAN_CLUSTER_ID }}

      - name: Update Kubernetes secrets
        run: |
          # Create a temporary secrets file
          cat << EOF > kubernetes/secrets.yaml
          apiVersion: v1
          kind: Secret
          metadata:
            name: backend-secrets
          type: Opaque
          stringData:
            db-connection-string: "${{ secrets.DB_CONNECTION_STRING }}"
            openai-api-key: "${{ secrets.OPENAI_API_KEY }}"
          EOF

          # Apply the secrets file
          kubectl apply -f kubernetes/secrets.yaml

          # Remove the temporary file to avoid committing sensitive information
          rm kubernetes/secrets.yaml

      - name: Deploy to Kubernetes
        run: |
          # Update image tags in Kubernetes manifests
          sed -i "s|image: .*fortune-frontend:.*|image: ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION }}|g" kubernetes/frontend-deployment.yaml
          sed -i "s|image: .*fortune-backend:.*|image: ${{ env.BACKEND_IMAGE }}:${{ env.VERSION }}|g" kubernetes/backend-deployment.yaml

          # Apply Kubernetes manifests
          kubectl apply -f kubernetes/
