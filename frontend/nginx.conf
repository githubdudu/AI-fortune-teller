server {
    listen 80;

    # Proxy API requests to the backend over Railway's private network.
    # resolver + variable: re-resolve on each request so a backend redeploy
    # (new private IP) doesn't leave nginx pointing at a stale address.
    location /api/ {
        resolver fd12::10;
        set $backend http://AI-fortune-teller-BE.railway.internal:8080;
        proxy_pass $backend;
        proxy_buffering off; # don't buffer streamed AI responses
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}